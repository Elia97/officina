name: Pin della CLI di Vercel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Lunedì 05:00 UTC, solo sul branch di default

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pin:
    name: La major del pin contro npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # I pin di tutti i progetti stanno qui: l'action di deploy e il gate di Lighthouse.
      - run: node src/bin.ts check vercel-cli
