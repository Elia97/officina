name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate, build e pacchetto impacchettato
    runs-on: ubuntu-latest
    steps:
      # I test che girano con --diff fanno il diff contro il merge-base: serve la storia intera.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      - run: pnpm run build

      # Quello che i test sui sorgenti non vedono: il tarball, installato in un progetto vuoto.
      - run: pnpm run test:pack
