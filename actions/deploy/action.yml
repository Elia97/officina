name: officina deploy
description: La produzione esce da un tag di release — gate, build di Vercel, deploy e smoke sull'apice.

# [HARD] I tre segreti entrano come input e finiscono nell'`env` dei soli tre passi che li usano.
# Nell'`env` del job li vedrebbero anche `pnpm install` e gli script di installazione di ogni
# dipendenza, che girano codice di terzi con in mano un token di deploy.
inputs:
  ref:
    description: 'Tag di release da deployare (vuoto = il tag più recente)'
    required: false
    default: ''
  vercel-token:
    description: 'Token Vercel — `${{ secrets.VERCEL_TOKEN }}`'
    required: true
  vercel-org-id:
    description: 'ID della organizzazione Vercel — `${{ secrets.VERCEL_ORG_ID }}`'
    required: true
  vercel-project-id:
    description: 'ID del progetto Vercel — `${{ secrets.VERCEL_PROJECT_ID }}`'
    required: true

outputs:
  url:
    description: L'URL del deployment di produzione
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    # Alla profondità di default actions/checkout non scarica tag, e il `git describe` sotto li vuole.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # `inputs.ref` arriva alla shell tramite env: infilare `${{ }}` dentro un `run:` è
    # iniezione di script (linee guida di sicurezza di GitHub Actions).
    - name: Risolve il tag da deployare
      id: target
      shell: bash
      env:
        REQUESTED_REF: ${{ inputs.ref }}
      run: |
        ref="$REQUESTED_REF"
        if [ -z "$ref" ]; then
          ref=$(git describe --tags --abbrev=0) || {
            echo "::error::nessun tag nel repository: la produzione esce da un tag di release, quindi non c'è ancora niente da deployare"
            exit 1
          }
          echo "::notice::Nessun ref indicato: deploy del tag più recente ($ref)."
        fi
        if ! git rev-parse -q --verify "refs/tags/$ref" > /dev/null; then
          echo "::error::$ref non è un tag: la produzione esce solo da tag di release"
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Checkout del tag
      shell: bash
      env:
        TARGET_REF: ${{ steps.target.outputs.ref }}
      run: git checkout --detach "refs/tags/$TARGET_REF"

    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm run check:placeholders
      shell: bash

    # Il `vercel build` qui sotto esegue solo `astro build`: niente Biome, niente astro check, niente vitest.
    - run: pnpm run ci
      shell: bash

    # Pin esatto: fissare la sola major ridà una CLI diversa ogni settimana, e un deploy che
    # fallisce non si riproduce. Che su npm ne esca una major più nuova lo dice ogni lunedì
    # `.github/workflows/vercel-cli.yml` di officina.
    - run: pnpm dlx vercel@59.22.0 pull --yes --environment=production
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - run: pnpm run check:placeholders --env .vercel/.env.production.local
      shell: bash

    - run: pnpm dlx vercel@59.22.0 build --prod
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Deploy su Vercel, produzione
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      run: |
        url=$(pnpm dlx vercel@59.22.0 deploy --prebuilt --prod)
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Deployment: $url"

    # `astro dev` non legge mai vercel.json: intestazioni e rewrite si provano davvero solo qui.
    - name: Smoke di produzione
      run: pnpm run smoke:prod
      shell: bash
