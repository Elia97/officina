name: officina ci
description: Il gate di un progetto nato dai template — pnpm run ci, build, budget di bundle e, a richiesta, gli scenari e2e.

inputs:
  e2e:
    description: "'true' per lanciare anche `pnpm run test:e2e` con il Chromium di Playwright"
    required: false
    default: 'false'
  migrate:
    description: 'Lo script delle migrazioni, per esempio `db:migrate`: le applica al database della corsa prima di `pnpm run ci`'
    required: false
    default: ''
  database-url:
    description: "L'indirizzo del database della corsa: il branch Neon che il workflow del progetto crea per la corsa"
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # I tre passi di preparazione sono ripetuti in ogni action: una composite non può richiamarne
    # un'altra dello stesso repository senza fissarne il tag dentro il proprio file.
    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: Tipi generati di Astro
      run: |
        pnpm exec astro sync || echo "::warning::astro sync non è riuscito: si prosegue senza i tipi generati"
      shell: bash

    # Una PR di Dependabot riceve solo i segreti di Dependabot, una da un fork nessuno: lì l'indirizzo è vuoto.
    - name: Migrazioni del branch di test
      if: ${{ inputs.migrate != '' }}
      shell: bash
      env:
        MIGRATE: ${{ inputs.migrate }}
        TEST_DATABASE_URL: ${{ inputs.database-url }}
      run: |
        if [ -z "$TEST_DATABASE_URL" ]; then
          echo "::notice::database-url è vuoto, come sulle PR di Dependabot o da un fork, dove il branch della corsa non nasce: non si migra niente, e i test di integrazione si saltano"
          exit 0
        fi
        pnpm exec officina migrate --script "$MIGRATE"

    # L'`env:` di un passo vince su quello del job anche quando vale ''; il log intitola il passo con la prima riga di `run`.
    - name: pnpm run ci
      shell: bash
      env:
        OFFICINA_TEST_DATABASE_URL: ${{ inputs.database-url }}
      run: |
        # pnpm run ci
        [ -z "$OFFICINA_TEST_DATABASE_URL" ] || export TEST_DATABASE_URL="$OFFICINA_TEST_DATABASE_URL"
        unset OFFICINA_TEST_DATABASE_URL
        pnpm run ci

    - run: pnpm exec officina check secrets --canaries >> "$GITHUB_ENV"
      shell: bash

    - name: pnpm run build
      shell: bash
      env:
        OFFICINA_TEST_DATABASE_URL: ${{ inputs.database-url }}
      run: |
        # pnpm run build
        [ -z "$OFFICINA_TEST_DATABASE_URL" ] || export DATABASE_URL="$OFFICINA_TEST_DATABASE_URL"
        unset OFFICINA_TEST_DATABASE_URL
        pnpm run build

    # Legge dist/client, quindi deve seguire la build.
    - run: pnpm run perf:bundle
      shell: bash

    - run: pnpm run check:links
      shell: bash

    # TODO: dalla 0.13.0 `check:secrets` è un errore di doctor: togli --if-present.
    - name: pnpm run check:secrets
      shell: bash
      env:
        OFFICINA_TEST_DATABASE_URL: ${{ inputs.database-url }}
      run: |
        # pnpm run check:secrets
        [ -z "$OFFICINA_TEST_DATABASE_URL" ] || export DATABASE_URL="$OFFICINA_TEST_DATABASE_URL"
        unset OFFICINA_TEST_DATABASE_URL
        pnpm run --if-present check:secrets

    - name: Cache del browser di Playwright
      if: ${{ inputs.e2e == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    # Solo chromium: gli scenari provano il codice del progetto, non le differenze fra motori.
    - if: ${{ inputs.e2e == 'true' }}
      run: pnpm exec playwright install --with-deps chromium
      shell: bash

    # Serve la stessa dist/client che perf:bundle ha appena misurato.
    - if: ${{ inputs.e2e == 'true' }}
      run: pnpm run test:e2e
      shell: bash
