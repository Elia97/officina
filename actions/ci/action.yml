name: officina ci
description: Il gate di un progetto nato dai template — pnpm run ci, build, budget di bundle e, a richiesta, gli scenari e2e.

inputs:
  e2e:
    description: "'true' per lanciare anche `pnpm run test:e2e` con il Chromium di Playwright"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # I tre passi di preparazione sono ripetuti in ogni action: una composite non può richiamarne
    # un'altra dello stesso repository senza fissarne il tag dentro il proprio file.
    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm run ci
      shell: bash

    - run: pnpm run build
      shell: bash

    # Legge dist/client, quindi deve seguire la build.
    - run: pnpm run perf:bundle
      shell: bash

    - name: Cache del browser di Playwright
      if: ${{ inputs.e2e == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    # Solo chromium: gli scenari provano il codice del progetto, non le differenze fra motori.
    - if: ${{ inputs.e2e == 'true' }}
      run: pnpm exec playwright install --with-deps chromium
      shell: bash

    # Serve la stessa dist/client che perf:bundle ha appena misurato.
    - if: ${{ inputs.e2e == 'true' }}
      run: pnpm run test:e2e
      shell: bash
