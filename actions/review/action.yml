name: officina review
description: La review informativa di fallow sul diff contro il merge-base. Esce sempre 0.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # il riepilogo di review fa il diff contro il merge-base

    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: fallow review (informativa, esce sempre 0)
      run: pnpm exec fallow review
      shell: bash
