name: officina review
description: La review informativa di fallow sul diff contro il merge-base. Un verdetto non blocca.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # il riepilogo di review fa il diff contro il merge-base

    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: Tipi generati di Astro
      run: |
        pnpm exec astro sync || echo "::warning::astro sync non è riuscito: si prosegue senza i tipi generati"
      shell: bash

    - name: 'fallow review (informativa: un verdetto non blocca)'
      run: pnpm exec fallow review --brief
      shell: bash
