name: officina lighthouse
description: Lighthouse CI su una build equivalente alla produzione. Informativo — il job che chiama lo tiene `continue-on-error`.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Abilita corepack
      run: corepack enable
      shell: bash

    - name: Percorso dello store di pnpm
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Installa le dipendenze
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build (robots.txt equivalente alla produzione)
      env:
        VERCEL_ENV: production
      run: pnpm build
      shell: bash

    - name: Lighthouse CI (autorun)
      run: pnpm run lhci
      shell: bash
